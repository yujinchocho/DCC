  --bg:#ECEEF2; --panel:#FFFFFF; --ink:#16181D; --muted:#626976; --line:#DCDFE5;
  --accent:#D9483F; --accent-ink:#FFFFFF; --accent-soft:#FCE9E7; --chip:#F3F4F7;
  --f-ui:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111317; --panel:#1A1D23; --ink:#ECEEF2; --muted:#9AA1AD; --line:#2B2F37;
  --accent:#F0675E; --accent-ink:#1A0B0A; --accent-soft:#3A201E; --chip:#23272E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111317; --panel:#1A1D23; --ink:#ECEEF2; --muted:#9AA1AD; --line:#2B2F37;
  --accent:#F0675E; --accent-ink:#1A0B0A; --accent-soft:#3A201E; --chip:#23272E; color-scheme:dark}

[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-text-size-adjust:100%}
.guide,.interlude-card,.panel,.dt-pad{word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;margin:0;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:300px minmax(0,1fr);height:100%;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.panel{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:auto}
.panel-in{display:flex;flex-direction:column;gap:22px;padding:20px 18px 24px}
.p-head h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.2px}
.p-head p{margin:4px 0 0;color:var(--muted);font-size:12.5px;line-height:1.5}
.p-sec{display:flex;flex-direction:column;gap:8px}
.p-label{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{height:34px;border-radius:9px;background:var(--chip);font-size:13px;font-weight:600;border:1px solid transparent}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg-row{display:grid;grid-template-columns:40px 1fr;align-items:center;gap:8px}
.seg-row span{font-size:12.5px;font-weight:600;color:var(--muted)}
.jump{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.jump button{height:32px;border-radius:9px;border:1px solid var(--line);font-size:12.5px;font-weight:600}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.toggle input{width:36px;height:20px;accent-color:var(--accent)}
.spec{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
.metrics{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:12.5px;margin:0}
.metrics dt{color:var(--muted)}
.metrics dd{margin:0;font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.log{font-family:var(--f-mono);font-size:11px;line-height:1.55;background:var(--chip);border-radius:10px;padding:8px 10px;max-height:220px;overflow:auto;margin:0;white-space:pre-wrap;word-break:break-all}
.log .t{color:var(--muted)}
.p-btns{display:flex;gap:6px}
.p-btns button{flex:1;height:32px;border-radius:9px;border:1px solid var(--line);font-size:12.5px;font-weight:600}

.stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;padding:20px 16px;gap:14px}
.guide{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;flex:none}
.g-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.g-step{font-size:11.5px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.g-review{display:none;height:28px;padding:0 10px;border-radius:8px;border:1px solid var(--line);font-size:12px;font-weight:600}
.g-body{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:end}
.g-text{min-width:0;display:flex;flex-direction:column;gap:4px}
.g-main{margin:0;font-size:15px;font-weight:600;line-height:1.45;text-wrap:balance}
.g-sub{margin:0;font-size:13px;color:var(--muted);line-height:1.5;min-height:3em}
.g-sub.nudge{color:var(--accent);font-weight:600}
.g-sub.hint{color:var(--ink);font-weight:600}
.g-sub mark{background:var(--accent-soft);color:var(--ink);border-radius:4px;padding:1px 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.g-sub.flash mark{animation:flash 1.1s ease 2}
@keyframes flash{50%{background:var(--accent);color:var(--accent-ink)}}
.g-btn{height:38px;padding:0 18px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;white-space:nowrap}
.g-btn.off{visibility:hidden}
.g-btn:not(.off){animation:rise .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(4px)}}
.phone-wrap{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:flex-start;position:relative}
.phone-box{position:relative;flex:none}
.interlude{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5}
.interlude-card{width:min(400px,calc(100% - 8px));background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.12)}
.il-body{display:flex;flex-direction:column;gap:18px}
.il-body p{margin:0;font-size:15px;line-height:1.65}
.il-sit strong{display:block;font-size:15px;font-weight:700;margin-bottom:2px}
.il-act p{font-weight:700}
.il-act mark,.g-main mark{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:1px 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.interlude{transition:background-color .3s ease}
.interlude-card{transition:opacity .3s ease,transform .3s ease}
.interlude.out{background:rgba(0,0,0,0)}
.interlude.out .interlude-card{opacity:0;transform:translateY(-28px) scale(.98)}
.g-step,.g-body{transition:opacity .35s ease}
.guide.blank .g-step,.guide.blank .g-body{opacity:0;visibility:hidden}
.guide{transition:border-color .3s ease,box-shadow .3s ease}
.guide.fresh{animation:fresh 1.4s ease}
@keyframes fresh{0%,40%{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}}
.interlude-card .g-btn{align-self:flex-end;visibility:visible;transition:opacity .45s ease}
.interlude-card .g-btn.wait{opacity:.35;cursor:default}

/* phone-width layout */
body.narrow .shell{grid-template-columns:minmax(0,1fr)}
body.narrow .panel{position:fixed;inset:0;z-index:100;border:0;transform:translateY(100%);transition:transform .25s ease;padding-top:env(safe-area-inset-top,0px)}
body.narrow.panel-open .panel{transform:none}
body.narrow .g-review{display:inline-flex;align-items:center}
.p-close{display:none}
body.narrow .p-close{display:inline-flex;align-self:flex-end;height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;font-weight:600;align-items:center}
body.frameless .stage{padding:0;gap:0}
body.frameless .guide{width:100%;border-radius:0;border-width:0 0 1px;padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));gap:4px}
body.frameless .g-main{font-size:14px}
body.frameless .g-sub{font-size:12.5px}
body.frameless .g-btn{height:34px;font-size:13.5px;padding:0 14px}
body.frameless .phone-wrap{align-items:stretch}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- phone (fixed 402pt app space, scaled) ---------- */
.phone{position:absolute;left:0;top:0;transform-origin:0 0;width:406px;height:878px;padding:2px;border-radius:50px;background:#101010;box-shadow:0 24px 60px rgba(0,0,0,.22)}
.screen{position:relative;width:402px;height:874px;border-radius:48px;overflow:hidden;background:#fff;color:#000;font-family:var(--f-ui);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
body.frameless .phone{padding:0;border-radius:0;box-shadow:none;width:402px}
body.frameless .screen{border-radius:0}
.sbar{position:absolute;left:0;top:0;width:402px;height:52px;z-index:60;pointer-events:none;background:#fff}
.sbar .time{position:absolute;left:50px;top:17px;font-size:16.5px;font-weight:600;letter-spacing:-.2px}
.sbar .island{position:absolute;left:139px;top:11px;width:124px;height:36px;border-radius:18px;background:#000}
.sbar .icons{position:absolute;right:30px;top:20px;display:flex;gap:6px;align-items:center}
.hind{position:absolute;left:131px;bottom:8px;width:140px;height:5px;border-radius:3px;background:#000;z-index:60;pointer-events:none}
body.frameless .sbar,body.frameless .hind{display:none}
.scr{position:absolute;inset:0;background:#fff;z-index:1}
.sc{position:absolute;left:0;right:0;top:52px;bottom:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.sc::-webkit-scrollbar{display:none}
body.frameless .sc{top:0}
.ct{position:relative;width:402px}
.ab{position:absolute}
img{display:block;-webkit-user-drag:none;pointer-events:none;max-width:none}
.screen button{display:block;text-align:left}
.press{transition:transform .12s ease}
.press:active{transform:scale(.97)}
.hit{position:absolute}
.hit::after{content:"";position:absolute;inset:-8px}
.h1{font-size:24px;font-weight:700;line-height:22px;white-space:nowrap}
.h2{font-size:18px;font-weight:600;line-height:22px;white-space:nowrap}
.dlogo{font-family:"Press Start 2P",ui-monospace,monospace;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
.box{background:#fff;border:.5px solid #d0d0d0;border-radius:18px;box-shadow:0 0 5px rgba(0,0,0,.1)}
.pillbtn{height:28px;border:.5px solid #a0a0a0;border-radius:16px;font-size:13px;font-weight:600;color:#808080;letter-spacing:-.65px;display:flex!important;align-items:center;justify-content:center}
.ico{display:flex;align-items:center;justify-content:center}
.ico svg{display:block}
.hs{position:absolute;left:0;width:402px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior-x:contain}
.hs::-webkit-scrollbar{display:none}
.hs.mouse{cursor:grab}.hs.drag{cursor:grabbing}
.row{display:flex;width:max-content;height:100%}
.row>*{flex:none}
.poster{width:113px;height:158px;border-radius:8px;overflow:hidden;background:#e0e0e0}
.poster img{width:100%;height:100%;object-fit:cover}
.watch{width:160px}
.wthumb{position:relative;width:160px;height:90px;border-radius:6px;overflow:hidden;background:#111}
.wthumb img{width:100%;height:100%;object-fit:cover}
.wplay{position:absolute;left:64px;top:27px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.85);color:#fff;display:flex;align-items:center;justify-content:center;padding-left:2px}
.wbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.75)}
.wbar i{display:block;height:100%;background:#3B82F6;border-radius:0 2px 2px 0}
.wmeta{display:flex;align-items:center;justify-content:space-between;margin-top:6px;font-size:13px;font-weight:500;line-height:20px;color:#111}
.wmeta span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wmore{flex:none;width:24px;height:24px;display:flex!important;align-items:center;justify-content:center;color:#444;margin-right:-6px}
.top10{position:relative;height:158px}
.tnum{position:absolute;left:0;top:80px;font-size:80px;font-weight:700;line-height:normal;background:linear-gradient(180deg,#000,#a0a0a0);-webkit-background-clip:text;background-clip:text;color:transparent}

/* bottom fade + nav */
.fade{position:absolute;left:0;bottom:0;width:402px;height:130px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.5) 40%);pointer-events:none;z-index:45}
.nav{position:absolute;left:27px;bottom:34px;width:348px;height:65px;border-radius:60px;background:rgba(255,255,255,.9);box-shadow:0 4px 20px rgba(0,0,0,.1);display:flex;padding:0 14px;z-index:62;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
body.frameless .nav{bottom:14px}
.nav button{width:64px;height:65px;display:flex!important;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:13px;gap:4px;color:#c0c0c0;border-radius:20px}
.nav button span{font-size:9px;font-weight:600;line-height:11px;white-space:nowrap}
.nav button.on{color:#000}
.nav button.on span{font-weight:700}
.nav button:active{background:rgba(0,0,0,.04)}
.nav.hidden{display:none}

/* toast */
.toast{position:absolute;left:50%;bottom:128px;transform:translate(-50%,10px);background:rgba(20,20,20,.88);color:#fff;font-size:13px;font-weight:500;padding:10px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:.22s;z-index:70;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* notice */
.notice{position:absolute;inset:0;z-index:61;background:rgba(0,0,0,.8);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);animation:nfade .25s ease}
@keyframes nfade{from{opacity:0}}
.n-blk{position:absolute;left:0;width:402px;height:461px}
.n-card{position:absolute;background:linear-gradient(180deg,#fff,#999);box-shadow:0 2px 50px rgba(0,0,0,.5)}
.n-card i{position:absolute;display:block;border-radius:10px;background:rgba(217,217,217,.9)}
.n-card b{position:absolute;display:block;border-radius:2px;background:rgba(208,208,208,.5)}
.n-title{position:absolute;left:0;width:402px;top:264px;text-align:center;color:#fff;font-size:21px;font-weight:700;line-height:25px}
.n-body{position:absolute;left:0;width:402px;top:306px;text-align:center;color:#fff;font-size:14.95px;line-height:1.6;white-space:pre-line}
.n-btn{position:absolute;left:129px;top:417px;width:144px;height:44px;border-radius:50px;background:rgba(160,160,160,.5);color:#fff;font-size:16px;font-weight:600;display:flex!important;align-items:center;justify-content:center;transition:color .45s ease}
.n-btn.lock{color:rgba(255,255,255,.3);cursor:default}

/* stack carousel */
.stk{position:absolute;touch-action:pan-y}
.stk-i{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform,opacity}
.stk.anim .stk-i{transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .38s ease}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:6px;height:6px;border-radius:3px;background:#d0d0d0;transition:background .2s}
.dots i.on{background:#000}

/* finance card */
.fcard{width:185px;height:293px;border-radius:12px;overflow:hidden;box-shadow:0 3px 7.5px rgba(0,0,0,.1);position:relative;background:#eee}
.fcard img{width:185px;height:293px}
.fcard .cta{position:absolute;left:20.5px;top:248px;width:144px;height:24px;background:#fff;border-radius:6px;font-size:10px;font-weight:600;letter-spacing:-.5px;display:flex;align-items:center;justify-content:center}
.ben{position:absolute;left:0;width:402px;text-align:center;font-size:12px;font-weight:500;line-height:20px;transition:opacity .18s}
.ben b{font-weight:800}

/* hero */
.hero{width:269px;height:378px;border-radius:16px;overflow:hidden;background:#ddd}
.hero img{width:100%;height:100%;object-fit:cover}

/* travel */
.tcity{position:relative;width:160px;height:253px;border-radius:16px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.1);color:#fff}
.tcity img{width:160px;height:253px;object-fit:cover}
.tcity .nm{position:absolute;left:16px;top:21px;font-size:15px;font-weight:600}
.tcity .ds{position:absolute;left:16px;top:45px;font-size:9px;font-weight:500;line-height:1.25;white-space:pre-line}
.tcity .mr{position:absolute;left:16px;top:212px;width:128px;height:22px;background:#fff;border-radius:4px;color:#606060;font-size:8px;font-weight:600;letter-spacing:-.4px;display:flex;align-items:center;justify-content:center}
.pick{position:absolute;top:175px;right:37px;font-size:14px;font-weight:800;line-height:22px}
.info{position:absolute;width:44px;height:44px;top:164px;right:2px;display:flex!important;align-items:center;justify-content:center;color:#8c8c8c;border-radius:22px}
.info:active{background:rgba(0,0,0,.05)}
.pop{position:absolute;left:16px;top:200px;width:370px;border:.5px solid #d0d0d0;border-radius:16px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 8px 20px rgba(0,0,0,.1);padding:16px 44px 16px 19.5px;color:#464646;z-index:20;opacity:0;transform:translateY(-6px) scale(.98);transform-origin:92% 0;pointer-events:none;transition:opacity .2s,transform .2s}
.pop.on{opacity:1;transform:none;pointer-events:auto}
.pop .m{font-size:12px;font-weight:500;line-height:1.4;white-space:pre-line;margin:0}
.pop .f{font-size:11px;line-height:1.4;white-space:pre-line;margin:5px 0 0}
.pop .x{position:absolute;right:6px;top:6px;width:36px;height:36px;display:flex!important;align-items:center;justify-content:center;color:#b0b0b0}

/* detail pages */
.dt-head{position:sticky;left:0;top:0;width:402px;height:52px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;background:#fff;z-index:5}
.dt-back{position:absolute!important;left:6px;top:4px;width:44px;height:44px;display:flex!important;align-items:center;justify-content:center}
.dt-body{padding-top:0}
.box > .ab:not(button){pointer-events:none}
.box button{pointer-events:auto}
.interlude{background:rgba(0,0,0,.28)}
.dt-hero{background:#f4f4f6;height:350px;display:flex;align-items:center;justify-content:center}
.dt-hero .fcard{box-shadow:0 12px 30px rgba(0,0,0,.15)}
.dt-pad{padding:22px 20px 0}
.dt-name{font-size:22px;font-weight:700;margin:0;letter-spacing:-.3px}
.dt-sub{font-size:14px;color:#808080;margin:6px 0 0}
.dt-sec{margin:28px 0 0;font-size:16px;font-weight:600}
.dt-list{margin:10px 0 0;padding:0;list-style:none}
.dt-list li{padding:14px 0;border-bottom:1px solid #eeeeee}
.dt-list li strong{display:block;font-size:15px;font-weight:600}
.dt-list li span{display:block;font-size:13px;color:#7a7a7a;margin-top:4px;line-height:1.5}
.dt-kv{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:12px 16px;font-size:14px}
.dt-kv dt{color:#808080}
.dt-kv dd{margin:0;text-align:right;font-weight:500}
.dt-cta{position:absolute;left:0;bottom:0;width:402px;padding:12px 20px 34px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 30%);z-index:5}
body.frameless .dt-cta{padding-bottom:16px}
.dt-cta button{width:100%;height:52px;border-radius:14px;background:#111;color:#fff;font-size:16px;font-weight:600;display:flex!important;align-items:center;justify-content:center}
.dt-poster{position:relative;height:340px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.dt-poster .bgimg{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);object-fit:cover;filter:blur(24px) brightness(.85);transform:scale(1.1)}
.dt-poster .pimg{position:relative;width:190px;height:268px;border-radius:12px;object-fit:cover;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.dt-meta{font-size:13px;color:#808080;margin:6px 0 0}
.dt-acts{display:flex;gap:8px;margin:18px 0 0}
.dt-acts button{flex:1;height:46px;border-radius:12px;font-size:15px;font-weight:600;display:flex!important;align-items:center;justify-content:center;gap:6px}
.dt-acts .pri{background:#111;color:#fff}
.dt-acts .sec{border:1px solid #d6d6d6}
.dt-syn{font-size:14px;line-height:1.65;color:#444;margin:10px 0 0}
.od-media{position:relative;width:402px;height:226px;background:#111;overflow:hidden}
.od-media img{width:100%;height:100%;object-fit:cover}
.od-media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,0) 32%,rgba(0,0,0,0) 72%,rgba(0,0,0,.15));pointer-events:none}
.od-close{position:absolute!important;left:6px;top:4px;width:44px;height:44px;display:flex!important;align-items:center;justify-content:center;color:#fff;z-index:2}
.od-play{position:absolute!important;left:171px;top:83px;width:60px;height:60px;border-radius:50%;border:2.5px solid #fff;color:#fff;background:rgba(0,0,0,.22);display:flex!important;align-items:center;justify-content:center;padding-left:3px;z-index:2}
.od-pad{padding:18px 16px 0}

<div class="shell">
  <aside class="panel" id="panel" aria-label="검토 패널">
    <div class="panel-in">
      <button class="p-close" id="pClose">닫기</button>
      <div class="p-head">
        <h1>DCC 실험 프로토타입</h1>
        <p>앱 화면만 구현한 검토용 버전이에요. 설문 문항은 다음 단계에서 붙여요.</p>
      </div>
      <div class="p-sec">
        <div class="p-label">조건</div>
        <div class="seg-row"><span>금융</span><div class="seg" data-dom="fin"><button data-c="fin-a">A 중립</button><button data-c="fin-b">B 서비스</button><button data-c="fin-c">C 혜택</button></div></div>
        <div class="seg-row"><span>OTT</span><div class="seg" data-dom="ott"><button data-c="ott-a">A 중립</button><button data-c="ott-b">B 서비스</button><button data-c="ott-c">C 혜택</button></div></div>
      </div>
      <div class="p-sec">
        <div class="p-label">단계 바로가기</div>
        <div class="jump"><button data-j="home">원 서비스 홈</button><button data-j="tab">추천 탭·고지</button><button data-j="travel">씽킹트래블</button></div>
      </div>
      <div class="p-sec">
        <label class="toggle" for="fast">대기 시간 1/10로 줄이기 <input type="checkbox" id="fast"></label>

      </div>
      <div class="p-sec">
        <div class="p-label">이번 세션 요약</div>
        <dl class="metrics" id="metrics"></dl>
      </div>
      <div class="p-sec">
        <div class="p-label">행동 기록 (최근 순)</div>

      </div>

// 참여자 기기의 현지 시각 + 시차 (예: 2026-11-01T02:41:26.123+09:00)
function localISO(d = new Date()) {
  const p = n => String(n).padStart(2, '0'), off = -d.getTimezoneOffset(), sg = off >= 0 ? '+' : '-';
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${String(d.getMilliseconds()).padStart(3, '0')}${sg}${p(Math.floor(Math.abs(off) / 60))}:${p(Math.abs(off) % 60)}`;
}
const LOG = {
  sid: '', cond: '', t0: 0, events: [], queue: [], device: {},
  start(cond) {
    this.sid = PID || ('S' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6));
    this.cond = cond; this.t0 = now(); this.events = []; this.queue = [];
    const coarse = matchMedia('(pointer:coarse)').matches;
    this.device = { vw: innerWidth, vh: innerHeight, dpr: devicePixelRatio, touch: coarse,
      layout: document.body.classList.contains('frameless') ? 'mobile-full' : 'framed',
      ua: navigator.userAgent };
    this.ev('session_start', { cond, device: this.device, fast: FAST });
  },
  ev(type, data = {}) {
    const e = { t: Math.round(now() - this.t0), ts: localISO(), type, stage: S.stage, screen: S.screen, ...data };
    this.events.push(e); this.queue.push(e); renderLog();
  },
  payload() { return { sid: this.sid, cond: this.cond, device: this.device, metrics: M, events: this.events }; },
  flush(beacon) {
    if (!CFG.LOG_ENDPOINT || !this.queue.length || !this.sid) return;
    const evs = this.queue.splice(0);
    const payload = { kind: 'events', pid: this.sid, cond: this.cond, events: evs };
    if (beacon && navigator.sendBeacon) {
      try { navigator.sendBeacon(CFG.LOG_ENDPOINT, new Blob([JSON.stringify({ study: STUDY.study, ...payload })], { type: 'text/plain' })); } catch (_) {}
    } else post(payload).catch(() => { this.queue.unshift(...evs); }); // 실패하면 다음 전송 때 다시 보냄
  }
};

// Apps Script 웹 앱으로 보내기 (text/plain → 사전 요청 없이 전송)
function post(obj, wantJson) {
  if (!CFG.LOG_ENDPOINT) return Promise.resolve(null);
  const body = JSON.stringify({ study: STUDY.study, ...obj });
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 8000);
  return fetch(CFG.LOG_ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body, signal: ctl.signal, keepalive: !wantJson && body.length < 60000 })
    .then(r => (wantJson ? r.json() : null)).finally(() => clearTimeout(tm));
}

function Stack(el, items, o) {
  const n = items.length;
  let pos = o.start || 0, active = o.start || 0, drag = null;
  el.innerHTML = items.map((h, i) => `<div class="stk-i" data-i="${i}" style="left:${o.x}px;width:${o.w}px;height:${o.h}px">${h}</div>`).join('');
  const nodes = [...el.children];
  const off = i => { let d = ((i - pos) % n + n) % n; if (d > n / 2) d -= n; return d; };

      const d = off(i), a = Math.abs(d), c = Math.min(a, 1);
      const sc = 1 - (1 - o.scale) * c;
      const op = a <= 1 ? 1 - (1 - o.op) * a : o.op * Math.max(0, 1 - (a - 1) * 2);
      nd.style.transform = `translateX(${d * o.shift}px) scale(${sc})`;
      nd.style.opacity = op;
      nd.style.zIndex = 100 - Math.round(a * 10);
      nd.style.pointerEvents = a < 0.5 ? 'auto' : 'none';
    });
  }
  function go(i, how) {
    const prev = active;
    active = ((i % n) + n) % n;
    el.classList.add('anim');
    // 최단 경로로 이동
    let d = active - pos; d = ((d % n) + n) % n; if (d > n / 2) d -= n;
    pos = pos + d; paint();

    if (active !== prev || how === 'init') o.onChange(active, how);
  }
  el.addEventListener('pointerdown', e => {
    if (e.button > 0) return;

    el.classList.remove('anim');

  el.addEventListener('click', e => e.preventDefault());

    else if (x > cx + o.w / 2) drag && (drag.target = nodes[(active + 1) % n]);

    e.preventDefault();

    if (now() - wT > 250) wAcc = 0;
    wT = now(); wAcc += e.deltaX;
    if (Math.abs(wAcc) > 40) { go(active + (wAcc > 0 ? 1 : -1), 'scroll'); wAcc = 0; wCool = now() + 600; }
  }, { passive: false });
  paint(); go(active, 'init');
  return { go, get active() { return active; } };
}

  if ($('notice') && act !== 'notice-ok') { LOG.ev('tap_blocked', { target: id }); return; }
  if (S.coach && act !== 'nav-tab') { coachNudge(id); return; }   // 2단계: 다른 곳을 누르면 말풍선이 흔들리며 다시 안내
  if (el.closest('.nav')) {   // 단계마다 쓸 수 있는 하단 탭은 하나 — 나머지를 누르면 그 탭 위에 말풍선
    const inTab = S.stage === 'tab';
    const allow = inTab ? 'nav-tab' : 'nav-home';
    if (act !== allow) {
      const where = inTab ? (S.dom === 'fin' ? '상품' : '추천') : '홈';
      M.nav_blocked = (M.nav_blocked || 0) + 1;
      LOG.ev('nav_blocked', { target: id, stage: S.stage });
      bubble(`[data-act="${allow}"]`, `지금은 ${where} 화면을 살펴봐 주세요`, { bounce: true, hideAfter: 2600 });
      updateMetrics(); return;
    }
  }
  if (S.stage === 'home') M.home_taps++;
  if (t) {
    M.inactive_taps++; LOG.ev('tap', { target: id, active: false });
    toast(t + josa(t) + ' 준비 중이에요'); updateMetrics(); return;
  }
  LOG.ev('tap', { target: id, active: true });
  switch (act) {
    case 'nav-home': {
      const sc = $('sc');
      if (S.screen.endsWith('_home')) sc && sc.scrollTo({ top: 0, behavior: 'smooth' });
      break;
    }
    case 'nav-tab':
      if (S.stage === 'tab') { if (!S.screen.startsWith(S.dom === 'fin' ? 'fin_product' : 'ott_rec')) { S.coach = false; showTab(!S.noticeShown); } }
      break;
    case 'notice-ok': confirmNotice(); break;
    case 'copy':
      toast('복사가 완료되었어요.');
      try { navigator.clipboard && navigator.clipboard.writeText('1002384729105').catch(() => {}); } catch (_) {}
      break;
    case 'back': closeDetail(); break;
    case 'info': setInfo(!$('pop').classList.contains('on'), 'button'); break;
    case 'info-close': setInfo(false, 'x'); break;
    case 'banner-close': {
      const b = $('fhBanner'); b.style.opacity = '0'; b.style.pointerEvents = 'none';
      $('fhBelow').style.transform = 'translateY(-187px)'; break;
    }
  }
  updateMetrics();
});

/* 가로 스크롤 영역: 마우스 드래그 지원 */
let dragMoved = false;
function initDrag() {
  screen.querySelectorAll('[data-drag]').forEach(el => {
    let down = false, sx = 0, sl = 0, moved = false;
    el.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; down = true; moved = false; sx = e.clientX; sl = el.scrollLeft; });
    el.addEventListener('mouseenter', () => el.classList.add('mouse'));
    const mv = e => { if (!down) return; const dx = (e.clientX - sx) / S.scale; if (Math.abs(dx) > 4) { moved = true; el.classList.add('drag'); } if (moved) el.scrollLeft = sl - dx; };
    const up = () => { if (!down) return; down = false; el.classList.remove('drag'); if (moved) { dragMoved = true; setTimeout(() => dragMoved = false, 0); LOG.ev('hscroll', { row: el.parentElement && el.style.top, left: Math.round(el.scrollLeft) }); } };
    addEventListener('pointermove', mv); addEventListener('pointerup', up);
    let tsx = 0;
    el.addEventListener('touchstart', e => { tsx = el.scrollLeft; }, { passive: true });
    el.addEventListener('touchend', () => { if (Math.abs(el.scrollLeft - tsx) > 20) LOG.ev('hscroll', { row: el.style.top, left: Math.round(el.scrollLeft) }); }, { passive: true });
  });
}

/* 다른 앱/탭으로 이동 */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { S.hiddenT = now(); LOG.ev('page_hidden', {}); }
  else if (S.hiddenT) { const d = Math.round(now() - S.hiddenT); M.hidden_ms += d; S.hiddenT = 0; LOG.ev('page_visible', { hidden_ms: d }); updateMetrics(); }
});

/* ================= 설문 ================= */
const AGREE = ['전혀 그렇지 않다', '그렇지 않다', '약간 그렇지 않다', '어느 쪽도 아니다', '약간 그렇다', '그렇다', '매우 그렇다'];
const PERSP = ['서비스·회사 중심', '', '', '어느 쪽에도 치우치지 않음', '', '', '사용자·나의 혜택 중심'];
const ANS = {};
const domWord = t => t.replace(/\{dom\}/g, S.dom === 'fin' ? '금융' : 'OTT');
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function showSurvey(on) {
  body.classList.toggle('in-survey', on); $('survey').hidden = !on;
  if (on) $('survey').scrollTop = 0; else layout();
}
function hook(name, fn) {
  const pages = STUDY.surveys && STUDY.surveys[name];
  if (!pages || !pages.length) return fn();
  clearTimers();
  // 설문 뒤 앱으로 돌아올 때 안내 팝업을 다시 띄우는 지점 (연구 설정의 resume)
  const rs = STUDY.resume && STUDY.resume[name];
  runPage(pages, 0, rs && SCENES[rs] ? () => scene(rs, SCENES[rs](S.dom), $('gStep').textContent, '확인', fn) : fn);
}
function itemHTML(it, n) {
  const [id, type, text, opt = {}] = it;
  const lg = `<legend><span class="qn">${n}</span><span>${esc(domWord(text))}${type === 'text' && opt.required === false ? ' <span class="sv-opt">(선택)</span>' : ''}</span></legend>`;
  if (type === 'likert' || type === 'persp') {
    const L = type === 'persp' ? PERSP : AGREE;
    return `<fieldset class="q" data-q="${id}" data-type="${type}">${lg}
      <div class="lk" role="radiogroup" aria-label="${esc(domWord(text))}">${L.map((l, k) => `<button type="button" role="radio" aria-checked="false" data-v="${k + 1}" aria-label="${k + 1}${l ? ' ' + l : ''}">${k + 1}</button>`).join('')}</div>
      <div class="lk-anc"><span>${L[0]}</span><span>${L[3]}</span><span>${L[6]}</span></div>
      <p class="lk-sel" aria-hidden="true"></p></fieldset>`;
  }
  if (type === 'choice') {
    return `<fieldset class="q" data-q="${id}" data-type="choice">${lg}
      <div class="ch" role="radiogroup">${opt.options.map((o, k) => `<button type="button" role="radio" aria-checked="false" data-v="${k + 1}"><span class="dot"></span><span>${esc(domWord(o))}</span></button>`).join('')}</div></fieldset>`;
  }
  return `<fieldset class="q" data-q="${id}" data-type="text" data-req="${opt.required === false ? 0 : 1}">${lg}
    <label class="sr" for="ta_${id}">${esc(domWord(text))}</label>
    <textarea id="ta_${id}" rows="${opt.rows || 3}" maxlength="2000" placeholder="자유롭게 적어 주세요."></textarea></fieldset>`;
}
function runPage(pages, i, done) {
  if (i >= pages.length) { showSurvey(false); done(); return; }
  const pg = pages[i], t0 = now(), cur = {};
  $('svIn').innerHTML = `<header class="sv-head"><h2>${esc(pg.title)}</h2><p>화면은 다시 볼 수 없어요. 기억나는 대로 답해 주세요.</p></header>
    ${pg.items.map((it, k) => itemHTML(it, k + 1)).join('')}
    <p class="sv-err" id="svErr" hidden>응답하지 않은 문항이 있어요. 표시된 문항에 답해 주세요.</p>
    <div class="sv-foot"><button class="g-btn" id="svNext">다음</button></div>`;
  showSurvey(true);
  LOG.ev('survey_show', { page: pg.id });
  $('svIn').querySelectorAll('.lk, .ch').forEach(g => g.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const fs = g.closest('.q'), id = fs.dataset.q, v = +b.dataset.v;
    g.querySelectorAll('button').forEach(x => x.setAttribute('aria-checked', x === b));
    cur[id] = v; fs.classList.remove('miss');
    const sel = fs.querySelector('.lk-sel');
    if (sel) { const L = fs.dataset.type === 'persp' ? PERSP : AGREE; sel.textContent = `선택: ${v}${L[v - 1] ? ' · ' + L[v - 1] : ''}`; }
  }));
  $('svIn').querySelectorAll('textarea').forEach(ta => ta.addEventListener('input', () => ta.closest('.q').classList.remove('miss')));
  $('svNext').addEventListener('click', () => {
    const miss = [];
    pg.items.forEach(([id, type, , opt = {}]) => {
      const fs = $('svIn').querySelector(`[data-q="${id}"]`);
      if (type === 'text') { const v = fs.querySelector('textarea').value.trim(); cur[id] = v; if (!v && opt.required !== false) miss.push(fs); }
      else if (!cur[id]) miss.push(fs);
    });
    $('svIn').querySelectorAll('.q').forEach(f => f.classList.toggle('miss', miss.includes(f)));
    if (miss.length) { $('svErr').hidden = false; miss[0].scrollIntoView({ behavior: 'smooth', block: 'center' }); LOG.ev('survey_missing', { page: pg.id, n: miss.length }); return; }
    const dur = Math.round(now() - t0);
    const ord = {}; pg.items.forEach(([id]) => { ord[id] = cur[id]; });   // 문항 순서대로
    Object.keys(cur).forEach(k => delete cur[k]); Object.assign(cur, ord);
    Object.assign(ANS, cur); M.survey_pages++;
    LOG.ev('survey_submit', { page: pg.id, page_ms: dur, answers: cur });
    const labels = {}; pg.items.forEach(([id, , text]) => { labels[id] = text.replace(/\{dom\}/g, '금융/OTT'); });
    post({ kind: 'page', pid: LOG.sid, cond: S.cond, page: pg.id, page_ms: dur, answers: cur, labels }).catch(() => {});
    LOG.flush(false);
    updateMetrics();
    runPage(pages, i + 1, done);
  });
}

/* ================= 동의 · 배정 · 마무리 ================= */
function showConsent() {
  const C = STUDY.consent, t0 = now();
  $('svIn').innerHTML = `<header class="sv-head"><h2>${esc(C.title)}</h2><p class="cs-lead">${esc(C.lead)}</p></header>
    <dl class="cs-list">${C.items.map(([a, b]) => `<div><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`).join('')}</dl>
    <div class="cs-agrees">${(C.agrees || [C.agree]).map((a, k) => `<label class="cs-agree" for="csAgree${k}"><input type="checkbox" class="cs-chk" id="csAgree${k}"> <span>${esc(a)}</span></label>`).join('')}</div>
    <p class="sv-err" id="svErr" hidden>동의에 체크해야 참여를 시작할 수 있어요.</p>
    <div class="sv-foot"><button class="g-btn" id="svNext">${esc(C.btn)}</button></div>`;
  showSurvey(true);
  $('svNext').addEventListener('click', async () => {
    if ([...document.querySelectorAll('.cs-chk')].some(c => !c.checked)) { $('svErr').hidden = false; return; }
    const btn = $('svNext'); btn.disabled = true; btn.textContent = '시작하는 중…';
    const [cond, how] = await assign();
    showSurvey(false);
    start(cond, 'home');
    LOG.ev('consent', { read_ms: Math.round(now() - t0), assign: how });
  });
}
async function assign() {
  const list = (STUDY.conds || Object.keys(CONDS)).filter(c => CONDS[c]);
  const saved = TEST ? null : store.get(SKEY + '_cond');
  if (CFG.LOG_ENDPOINT) {
    try {
      const r = await post({ kind: 'assign', key: KEY, test: TEST }, true);
      if (r && CONDS[r.cond] && r.pid) { PID = r.pid; store.set(SKEY + '_cond', r.cond); return [r.cond, r.again ? 'server-again' : 'server']; }
    } catch (_) {}
  }
  PID = (TEST ? 'TEST-' : 'LOCAL-') + KEY;   // 서버에 연결되지 않았을 때 임시 번호
  if (saved && CONDS[saved]) return [saved, 'saved'];
  const c = list[Math.floor(Math.random() * list.length)]; store.set(SKEY + '_cond', c);
  return [c, CFG.LOG_ENDPOINT ? 'local-fallback' : 'local'];
}
function showEnd() {
  const E = STUDY.end, code = 'DCC-' + LOG.sid.slice(-6).toUpperCase();
  $('svIn').innerHTML = `<header class="sv-head"><h2>${esc(E.title)}</h2></header>
    <div class="end-body">${E.body.map(t => `<p>${esc(t)}</p>`).join('')}
    ${E.code ? `<div class="end-code"><span>완료 코드</span><strong id="endCode">${code}</strong><button class="p-btn" id="copyCode">복사</button></div>` : ''}</div>`;
  showSurvey(true);
  post({ kind: 'complete', pid: LOG.sid, cond: S.cond, code: E.code ? code : '', metrics: M, device: LOG.device }).catch(() => {});
  const cb = $('copyCode');
  if (cb) cb.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(code); cb.textContent = '복사했어요'; }
    catch (_) { const r = document.createRange(); r.selectNodeContents($('endCode')); const sl = getSelection(); sl.removeAllRanges(); sl.addRange(r); cb.textContent = '선택됨'; }
  });
}

/* ================= 검토 패널 ================= */
const fmt = v => v === null || v === undefined ? '–' : (typeof v === 'number' ? (v / 1000).toFixed(1) + '초' : v);
function updateMetrics() {
  const rows = [
    ['홈 체류', M.home_ms ? fmt(M.home_ms) : '–'],
    ['막힌 하단 탭 누름', (M.nav_blocked || 0) + '회'],
    ['고지 확인까지', fmt(M.notice_ms)],
    ['잠금 중 확인 탭', M.notice_early_taps + '회'],
    ['추천 핵심 항목 확인', M.seen + ' / 3'],
    ['캐러셀 이동', M.carousel_moves + '회'],
    ['상세 화면 열람', M.details + '회 · ' + (M.detail_ms / 1000).toFixed(1) + '초'],
    ['추천 탭 탐색', fmt(M.explore_ms)],
    ['ⓘ 첫 열람까지', fmt(M.info_first_ms)],
    ['ⓘ 힌트 후 열람', M.info_prompted === null ? '–' : (M.info_prompted ? '예' : '아니요 (자발적)')],
    ['ⓘ 열람 합계', M.info_opens + '회 · ' + (infoTotal() / 1000).toFixed(1) + '초'],
    ['준비 중 요소 탭', M.inactive_taps + '회'],
    ['2단계 탭 이동 전 다른 곳 탭', M.offtask_taps + '회'],
    ['다른 화면으로 이탈', fmt(M.hidden_ms)],
    ['설문 페이지 제출', M.survey_pages + '쪽']
  ];
  $('metrics').innerHTML = rows.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('');
}
function renderLog() {
  const el = $('log'); if (!el) return;
  const ev = LOG.events.slice(-80).reverse();
  el.innerHTML = ev.map(e => {
    const s = (e.t / 1000).toFixed(1).padStart(6, ' ');
    const { t, ts, type, stage, screen: sc, ...rest } = e;
    const extra = Object.entries(rest).filter(([k]) => k !== 'device' && k !== 'metrics').map(([k, v]) => `${k}=${typeof v === 'object' ? JSON.stringify(v) : v}`).join(' ');
    return `<span class="t">${s}s</span> ${type}${extra ? ' ' + extra : ''}`;
  }).join('\n');
}
function setSpec() {
  const f = FAST ? ' (지금은 1/10)' : '';
  $('spec').textContent = `시나리오 팝업 ${CFG.SCENE_MIN}초 (2단계 ${CFG.SCENE_MIN_BY.tab}초) · 홈 ${CFG.HOME_MIN}초 후 다음 · 고지 확인 ${CFG.NOTICE_LOCK}초 잠금 · 탐색 ${CFG.EXPLORE_MIN}초${CFG.EXPLORE_SEEN ? ' + 핵심 ' + CFG.EXPLORE_SEEN + '개 확인' : ''} · ⓘ 힌트 ${CFG.HINT_AFTER}초 · ⓘ ${CFG.INFO_MIN}초 열람${f}`;
}
function markCond() {
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.c === S.cond));
}
function start(cond, stage) {
  clearTimers();
  if (S.screen) leaveScreen();
  S.screen = '';
  S.cond = cond; [S.dom, S.notice] = CONDS[cond];
  resetMetrics(); S.seen = new Set(); S.noticeShown = false; S.exploreT = 0; S.stageT = 0;
  LOG.start(cond);
  markCond();
  if (stage === 'tab') { S.stage = 'home'; gotoStage('tab'); }
  else if (stage === 'travel') { S.stage = 'tab'; screen.innerHTML = `<section class="scr"></section>${SBAR}<div class="toast" id="toast"></div>`; gotoStage('travel'); }
  else { S.stage = ''; hook('before_home', () => gotoStage('home')); }
  if (REVIEW) { try { history.replaceState(null, '', '#' + (STUDY.mode === 'review' ? '' : 'review-') + cond + (stage && stage !== 'home' ? '-' + stage : '')); } catch (_) {} }
}
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { start(b.dataset.c, 'home'); closePanel(); }));
document.querySelectorAll('.jump button').forEach(b => b.addEventListener('click', () => { start(S.cond, b.dataset.j); closePanel(); }));
$('fast').addEventListener('change', e => { FAST = e.target.checked; setSpec(); start(S.cond, 'home'); });
$('restart').addEventListener('click', () => { start(S.cond, 'home'); closePanel(); });
$('copyLog').addEventListener('click', async e => {
  const txt = JSON.stringify(LOG.payload(), null, 1);
  const btn = e.currentTarget;
  try { await navigator.clipboard.writeText(txt); btn.textContent = '복사했어요'; }
  catch (_) { const el = $('log'); const r = document.createRange(); el.textContent = txt; r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = '선택됨 · 직접 복사하세요'; }
  setTimeout(() => { btn.textContent = '기록 복사 (JSON)'; renderLog(); }, 1800);
});
const openPanel = () => body.classList.add('panel-open'), closePanel = () => body.classList.remove('panel-open');
$('openPanel').addEventListener('click', openPanel); $('pClose').addEventListener('click', closePanel);

/* ================= 시작 ================= */
function fromHash() {
  const h = (location.hash || '').slice(1);
  const m = h.match(/(fin|ott)-(a|b|c)(?:-(tab|travel))?(?![a-z])/);
  return m ? [m[1] + '-' + m[2], m[3] || 'home'] : ['fin-a', 'home'];
}
body.classList.toggle('participant', !REVIEW);
setSpec(); layout();
if (REVIEW) {
  const [c0, s0] = fromHash();
  start(c0, s0);
  addEventListener('hashchange', () => { const [c, s] = fromHash(); if (c !== S.cond) start(c, s); });
} else showConsent();
if (window.ResizeObserver) new ResizeObserver(layout).observe($('pwrap'));
})();
</script>
